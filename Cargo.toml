[package]
name = "fi-ethr-resolver"
version = "0.0.6"
repository = "https://github.com/ravindu-rev/fi-ethr-resolver"
authors = ["Ravindu Wijegunawardhana <ravindu.w@fidenz.com>"]
description = "Ethereum did resolver for Rust"
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bs58 = "0.5.1"
ethers = "2.0.14"
fi-common = "0.1.1"
hex = "0.4.3" 
regex = "1.10.6"
secp256k1 = "0.29.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128" 
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1.41.1", features = ["full"] }